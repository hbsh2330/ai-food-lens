name: food_nutrition_app
description: AI food recognition and nutrition information app.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  image_picker: ^1.1.2
  table_calendar: ^3.2.0
  google_sign_in: ^6.2.2
  flutter_secure_storage: ^9.2.4
  kakao_flutter_sdk_common: ^2.0.0+1
  kakao_flutter_sdk_user: ^2.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/food_catalog.json


